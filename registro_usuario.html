<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Usuario - AtelierStudio</title>

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="styles.css">
</head>

<body class="pagina_registro">

    <!-- Logo de la empresa -->
    <div class="logo">
        <img
            src="imagenes/atelierstudiologo.png"
            alt="Logo AtelierStudio"
            class="logo"
        >
    </div>

    <!-- Contenido principal del registro -->
    <main class="inforegistro">

        <div class="palabra_registro">
            <h1>Crear Cuenta </h1>
        </div>

        <!-- Formulario de registro -->
        <form id="formRegistro" class="campos_registro" novalidate>

            <p class="aviso-obligatorio">
                 <span class="obligatorio">*</span> Campos obligatorios
            </p>

            <!-- RUN -->
            <div>
                <label for="run">
                    <strong>RUN: <span class="obligatorio">*</span> </strong>
                </label>

                <input
                    type="text"
                    id="run"
                    name="run"
                    placeholder="Ej: 19011022K (Sin puntos ni guion)"
                >

                <small class="texto-ayuda">
                      Mínimo 7 y máximo 9 caracteres.
                </small>

                <small id="errorRun"></small>
            </div>

            <!-- Nombre -->
            <div>
                <label for="nombre">
                    <strong>Nombre: <span class="obligatorio">*</span> </strong>
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                >

                <small id="errorNombre"></small>
            </div>

            <!-- Apellidos -->
            <div>
                <label for="apellidos">
                    <strong>Apellidos: <span class="obligatorio">*</span> </strong>
                </label>

                <input
                    type="text"
                    id="apellidos"
                    name="apellidos"
                >

                <small id="errorApellidos"></small>
            </div>

            <!-- Correo electrónico -->
            <div>
                <label for="correo">
                    <strong>Correo electrónico: <span class="obligatorio">*</span> </strong>
                </label>

                <input
                    type="text"
                    id="correo"
                    name="correo"
                    placeholder="ejemplo@duocuc.cl"
                >

                <small class="texto-ayuda">
                    Solo se permiten dominios @duocuc.cl,
                    @profesor.duocuc.cl y @gmail.com
                </small>

                <small id="errorCorreo"></small>
            </div>

            <!-- Fecha de nacimiento -->
            <div>
                <label for="fechaNacimiento">
                    <strong>Fecha de Nacimiento:</strong>
                </label>

                <input
                    type="date"
                    id="fechaNacimiento"
                    name="fechaNacimiento"
                >
            </div>

            <!-- Tipo de usuario -->
            <div>
                <label for="tipoUsuario">
                    <strong>Tipo de Usuario / Perfil:</strong>
                </label>

                <select
                    id="tipoUsuario"
                    name="tipoUsuario"
                >
                    <option value="Cliente" selected>Cliente</option>
                    <option value="Vendedor">Vendedor</option>
                    <option value="Administrador">Administrador</option>
                </select>
            </div>

            <!-- Región -->
            <div>
                <label for="region">
                    <strong>Región: <span class="obligatorio">*</span> </strong>
                </label>

                <select
                    id="region"
                    name="region"
                >
                    <option value="">Seleccione una Región</option>
                </select>

                <small id="errorRegion"></small>
            </div>

            <!-- Comuna -->
            <div>
                <label for="comuna">
                    <strong>Comuna: <span class="obligatorio">*</span> </strong>
                </label>

                <select
                    id="comuna"
                    name="comuna"
                >
                    <option value="">Seleccione una Comuna</option>
                </select>

                <small id="errorComuna"></small>
            </div>

            <!-- Dirección -->
            <div>
                <label for="direccion">
                    <strong>Dirección: <span class="obligatorio">*</span> </strong>
                </label>

                <input
                    type="text"
                    id="direccion"
                    name="direccion"
                    placeholder="Calle, número"
                >

                <small id="errorDireccion"></small>
            </div>

            <!-- Botones -->
            <div class="botones_registro">

                <button
                    type="submit"
                    class="btn-registrar"
                >
                    <strong>REGISTRAR</strong>
                </button>

                <a href="login.html">
                    <strong>Volver al Inicio de Sesión</strong>
                </a>

            </div>

        </form>

    </main>

    <!-- Regiones y comunas -->
    <script src="regiones.js"></script>

    <!-- Validaciones del formulario -->
    <script src="registro.js"></script>

</body>

</html>
