<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro de Usuario</title>

        <!-- Estilos personalizados -->
        <link rel="stylesheet" href="styles.css">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU90FeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>

    <body class="pagina_registro">

        <!-- Logo de la empresa -->
        <div class="logo">
            <img src="../imagenes/atelierstudiologo.png" alt="Logo AtelierStudio">
        </div>

        <br>

        <!-- Contenido principal del registro -->
        <main class="inforegistro">

            <div class="palabra_registro">
                <h1>Crear Cuenta</h1>
            </div>

            <!-- Formulario de registro -->
            <form class="campos_registro" novalidate>

                <p class="aviso_obligatorio" style="color: white !important;"><span class="camp_oblig">*</span> Campos obligatorios</p>

                <!-- RUN -->
                <div>
                    <label for="run"><strong>RUT: <span class="run_oblig">*</span> </strong></label>
                    <input type="text" class="run" name="run" id="run" maxlength="9" placeholder="Ejemplo: 19011022K">
                    <small class="texto-ayuda">Se requiere un mínimo 7 y un máximo de 9 caracteres, sin puntos ni guión.</small>
                    <small class="errorRun"></small>
                </div>

                <!-- Nombre -->
                <div>
                    <label for="nombre"><strong>Nombre: <span class="nomb_oblig">*</span></strong></label>
                    <input type="text" class="nombre" name="nombre" id="nombre" maxlength="50" placeholder="Ingresa tu nombre">
                    <small class="errorNombre"></small>
                </div>

                <!-- Apellidos -->
                <div>
                    <label for="apellidos"><strong>Apellidos: <span class="apel_oblig">*</span></strong></label>
                    <input type="text" class="apellidos" name="apellidos" id="apellidos" maxlength="100" placeholder="Ingresa tus apellidos">
                    <small class="errorApellidos"></small>
                </div>

                <!-- Correo electrónico -->
                <div>
                    <label for="correo"><strong>Correo electrónico: <span class="correo_oblig">*</span></strong></label>
                    <input type="email" class="correo" name="correo" id="correo" maxlength="100" placeholder="ejemplo@gmail.com">
                    <small class="texto-ayuda">Solo dominios @duoc.cl, @profesor.duoc.cl, @gmail.com y @hotmail.com</small>
                    <small class="errorCorreo"></small>
                </div>

                <!-- Contraseña -->
                <div>
                    <label for="contrasena"><strong>Contraseña: <span class="contrasena_oblig">*</span></strong></label>
                    <input type="password" class="contrasena" name="contrasena" id="contrasena" maxlength="10" placeholder="Entre 4 y 10 caracteres">
                    <small class="texto-ayuda">La contraseña debe tener entre 4 y 10 caracteres.</small>
                    <small class="errorContrasena"></small>
                </div>

                <!-- Confirmar contraseña -->
                <div>
                    <label for="confirmarContrasena"><strong>Confirmar contraseña: <span class="conf_contrasena_oblig">*</span></strong></label>
                    <input type="password" class="confirmarContrasena" name="confirmarContrasena" id="confirmarContrasena" maxlength="10" placeholder="Repite tu contraseña">
                    <small class="errorConfirmarContrasena"></small>
                </div>

                <!-- Teléfono -->
                <div>
                    <label for="telefono"><strong>Teléfono de contacto:</strong></label>
                    <input type="text" class="telefono" name="telefono" id="telefono" placeholder="Ejemplo: 912345678">
                    <small class="errorTelefono"></small>
                </div>

                <!-- Fecha de nacimiento -->
                <div>
                    <label for="fechaNacimiento"><strong>Fecha de nacimiento:</strong></label>
                    <input type="text" class="fechaNacimiento" name="fechaNacimiento" id="fechaNacimiento" maxlength="10" placeholder="DD/MM/YYYY" autocomplete="off">
                </div>

                <!-- Región -->
                <div>
                    <label for="region"><strong>Región: <span class="region_oblig">*</span></strong></label>
                    <select class="region" name="region" id="region"><option value="">Seleccione una región</option></select>
                    <small class="errorRegion"></small>
                </div>

                <!-- Comuna -->
                <div>
                    <label for="comuna"><strong>Comuna: <span class="comuna_oblig">*</span></strong></label>
                    <select class="comuna" name="comuna" id="comuna"><option value="">Seleccione una comuna</option></select>
                    <small class="errorComuna"></small>
                </div>

                <!-- Dirección -->
                <div>
                    <label for="direccion"><strong>Dirección: <span class="dire_oblig">*</span></strong></label>
                    <input type="text" class="direccion" name="direccion" id="direccion" maxlength="300" placeholder="Calle #número, depto. #número">
                    <small class="errorDireccion"></small>
                </div>

                <!-- Botones -->
                <div class="botones_registro">
                    <br>
                    <button type="submit" class="btn_registrar"><strong>REGISTRAR</strong></button>
                    <a href="login.html"><strong>Volver al Inicio de Sesión</strong></a>
                </div>
            </form>
        </main>

        <!-- Regiones y comunas -->
        <script src="regiones.js"></script>

        <!-- Validaciones del formulario -->
        <script src="registro.js"></script>
    </body>
</html>
