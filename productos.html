<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Productos</title>

        <!-- Estilos personalizados-->
        <link rel="stylesheet" href="styles.css">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU90FeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        
    </head>
    <body id="prod">

        <!-- Título de 'productos', logo y botones -->
        <header id="titulo_prod">

            <!-- Título y logo -->
            <figure id="titlogo">
                <img src="imagenes/atelierstudiologo.png">
                <h2>Productos</h2>
            </figure>

            <!-- Botones de navegación -->
            <figure id="btns_navegacion_prod">
                <button id="nav_btn"><strong>Portada</strong></button>
                <button id="nav_btn"><strong>Nosotros</strong></button>
                <button id="nav_btn"><strong>Carrito</strong></button>
                <button id="nav_btn"><strong>Búsqueda</strong></button>
                <button id="nav_btn"><strong>Foro</strong></button>
                <button id="nav_btn"><strong>Blog</strong></button>
                <button id="nav_btn"><strong>Ayuda</strong></button>
            </figure>
        </header>

        <!-- Contenido principal de productos -->

        <main class="contenido_productos">

            <h1>Productos</h1>

            <!-- JavaScript mostrará aquí los productos -->

            <section id="contenedor_prod"></section>

        </main>

        <!-- Funciones y arreglo de productos -->

        <script src="productos.js"></script>
        
    </body>
</html>
