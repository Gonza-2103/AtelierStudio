        <!-- Estilos personalizados-->

    <body id="prod">

        <!-- Título de 'productos', logo y botones -->
        <header id="titulo_prod">

            <!-- Título y logo -->
            <figure id="titlogo">
                <img src="imagenes/atelierstudiologo.png">
                <h2>Productos</h2>
            </figure>

            <!-- Botones de navegación -->
            <figure id="btns_navegacion_prod">
                <button id="nav_btn"><strong>Portada</strong></button>
                <button id="nav_btn"><strong>Nosotros</strong></button>
                <button id="nav_btn"><strong>Carrito</strong></button>
                <button id="nav_btn"><strong>Búsqueda</strong></button>

                <button id="nav_btn"><strong>Ayuda</strong></button>

        </header>
        
        <!-- Contenido principal de productos -->
        <section id="contenedor_prod">
            <section id="contenedor_prod_1">
                <figure id="contador_prod">
                    <h3>Cuadro 'Mar y Playa'</h3>
                    <h5>Fotografía aérea en plano cenital que captura el contraste entre las aguas turquesas del océano y la orilla de arena blanca, destacando el movimiento de la espuma de las olas rompiendo suavemente en la costa.</h5>
                    <h5 id="precio_prod1">$45.000</h5>
                    <img src="imagenes/fotoarte1.jpg">
                        <div id="btns_cont_prod">
                            <button id="btn_restar"><strong>&minus;</strong></button>
                            <span id="numero_prod"><strong>0</strong></span>
                            <button id="btn_sumar"><strong>+</strong></button>
                        </div>
                        <figure id="btn_agr_car_det">
                            <button id="btn_ver_det">VER DETALLES</button>
                            <button id="btn_car_comp">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shopping-cart-icon lucide-shopping-cart"><path d="m2.05 2.05 1.099-.028a1 1 0 0 1 1.008.815l2.69 14.347A1 1 0 0 0 7.83 18H18"/><path d="M4.563 5h16.435a1 1 0 0 1 .981 1.204l-1.026 6.226A2 2 0 0 1 18.962 14H6.25"/><circle cx="18" cy="20" r="2"/><circle cx="8" cy="20" r="2"/></svg>
                            </button>
                        </figure>
                </figure>
            </section>
            <section id="contenedor_prod_2">
                <figure id="contador_prod">
                    <h3>Retrato 'Caballero con Pipa'</h3>
                    <h5>Pintura al óleo de estilo expresivo que retrata de perfil a un marinero o pescador de mirada reflexiva, sosteniendo una pipa humeante en la boca y herramientas de red, con un fondo de playa y mar abierto.</h5>
                    <h5 id="precio_prod2">$60.000</h5>
                    <img src="imagenes/fotoarte2.jpg">
                        <div id="btns_cont_prod">
                            <button id="btn_restar"><strong>&minus;</strong></button>
                            <span id="numero_prod"><strong>0</strong></span>
                            <button id="btn_sumar"><strong>+</strong></button>

                            </button>
                        </figure>
                </figure>
            </section>
            <section id="contenedor_prod_3">
                <figure id="contador_prod">
                    <h3>Cuadro 'Paisaje de Montaña'</h3>
                    <h5>Pintura paisajística tradicional al óleo que muestra una cordillera alpina nevada reflejada en un lago sereno de aguas cristalinas, flanqueado por densos bosques de coníferas bajo un cielo parcialmente nublado.</h5>
                    <h5 id="precio_prod3">$48.000</h5>
                    <img src="imagenes/fotoarte3.png">
                        <div id="btns_cont_prod">
                            <button id="btn_restar"><strong>&minus;</strong></button>

                            </button>

            </section>
            <section id="contenedor_prod_4">
                <figure id="contador_prod">
                    <h3>Retrato 'Gato entre Sombras'</h3>
                    <h5>Acuarela luminosa que ilustra a un gato atigrado de pelaje naranja y blanco sentado en un escalón de piedra, envuelto en un marcado juego de luces solares directas y sombras violáceas proyectadas por la vegetación.</h5>
                    <h5 id="precio_prod4">$72.000</h5>
                    <img src="imagenes/fotoarte4.png">
                        <div id="btns_cont_prod">
                            <button id="btn_restar"><strong>&minus;</strong></button>
                            <span id="numero_prod"><strong>0</strong></span>

                        </div>
