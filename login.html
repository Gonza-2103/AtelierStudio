<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtelierStudio</title>

    <!-- Estilos personalizados-->
    <link rel="stylesheet" href="styles.css">

    <!-- Bootstrap CSS -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU90FeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="pagina_login">
    
    <div class="adm">
        <button type="button" class="btn-admin">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-user-icon lucide-shield-user"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M6.376 18.91a6 6 0 0 1 11.249.003"/><circle cx="12" cy="11" r="4"/></svg>
        </button>
    </div>

    <div class="logo">
        <img src="AtelierStudio (logo sin fondo).png" alt="Logo AtelierStudio" class="logo">
    </div>

    <div class="infologin">
        <div class="palabra_login">
            <h1>Iniciar sesión</h1>
        </div>

        <form class="campos_login">

            <!-- Campo del correo electrónico -->
            <input type="text" id="correo" placeholder="Correo electrónico"><br>
            
            <!-- Campo de la contraseña -->
            <input type="password" id="clave" placeholder="Contraseña"><br><br>
            
            <!-- Botones -->
            <div class="botones_login">
                
                <button class="btn-inicio-sesion">
                    <strong>INICIAR SESIÓN</strong>
                </button>
                
                <button class="btn-registro">
                    <strong>REGISTRAR</strong>
                </button>
            </div>

            <br><button class="forgot">
                <strong>¿Se te olvidó la contraseña?</strong>
            </button>
        </form>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
