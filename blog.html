<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Blog</title>

        <!-- Estilos personalizados-->
        <link rel="stylesheet" href="styles.css">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU90FeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        
    </head>
    <body class="blog">

        <!-- Título de 'blog', logo y botones -->
        <header class="titulo_blog">

            <figure class="titlogo">
                <img src="imagenes/atelierstudiologo.png">
                <h2>Blog</h2>
            </figure>

            <!-- Botones de navegación -->
            <figure class="btns_navegacion_blog">
                <button class="nav_btn"><strong>Portada</strong></button>
                <button class="nav_btn"><strong>Nosotros</strong></button>
                <button class="nav_btn"><strong>Productos</strong></button>
                <button class="nav_btn"><strong>Carrito</strong></button>
                <button class="nav_btn"><strong>Búsqueda</strong></button>
                <button class="nav_btn"><strong>Foro</strong></button>
                <button class="nav_btn"><strong>Ayuda</strong></button>
            </figure>
        </header>

        <main class="contenido_blog">

            <section class="casos_contenido_blog">
                <h2 class="titulo_casos_contenido_blog"><strong>NOTICIAS IMPORTANTES</strong></h2>

                <br>
                <hr color="white"/>
                <article class="caso">
                    <figure class="info_caso">
                        <h3 class="titulo_caso">CASO CURIOSO #1</h3>
                        <br>
                        <img src="pigmentos.jpeg" class="img1" style="width: 50%;"/>

                        <p class="descripcion_caso">
                            ¿Sabías que el uso de pigmentos naturales en el óleo antiguo permitía que las pinturas cambiaran de tonalidad con el paso de las décadas?
                        </p>
                        <p class="descripcion_caso">
                            Descubre como hoy en día los artistas independientes contemporáneos rescatan estas técnicas ancestrales en sus talleres.
                        </p>
                        <a href="detalle_blog1.html" class="btn_caso1"><strong>VER CASO</strong></a>
                    </figure>
                </article>
                
                <br>
                <hr color="white"/>
                <article class="caso">
                    <figure class="info_caso">
                        <h3 class="titulo_caso">CASO CURIOSO #2</h3>
                        <br>
                        <img src="imagenes/luznatural.jpg" class="img2" style="width: 50%;"/>

                        <p class="descripcion_caso">
                            El impacto de la luz natural en las acuarelas: un secreto guardado por siglos. Analizamos cómo proteger tus grabados y obras en papel para mantener su brillo y pigmentación original como el primer día.
                        </p>
                        <a href="detalle_blog2.html" class="btn-ver-caso"><strong>VER CASO</strong></a>
                    </figure>
                    
                </article>
            </section>

            <br>
            <hr color="white"/>

        <!-- Pie de página informativo -->
        <footer class="pie_pag_blog">
