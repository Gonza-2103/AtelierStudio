<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contacto</title>

        <!-- Estilos personalizados -->
        <link rel="stylesheet" href="styles.css">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU90FeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>
    <body class="ayuda">

        <!-- Encabezado de la página -->
        <header class="titulo_ayuda">

            <figure class="titlogo">
                <img src="imagenes/atelierstudiologo.png" alt="Logo de AtelierStudio">
                <h2>Contacto</h2>
            </figure>
            <figure class="btns_navegacion_ayuda">
                <button class="nav_btn" onclick="location.href='portada.html'"><strong>Portada</strong></button>
                <button class="nav_btn" onclick="location.href='nosotros.html'"><strong>Nosotros</strong></button>
                <button class="nav_btn" onclick="location.href='productos.html'"><strong>Productos</strong></button>
                <button class="nav_btn" onclick="location.href='carrito.html'"><strong>Carrito</strong></button>
                <button class="nav_btn" onclick="location.href='busqueda.html'"><strong>Búsqueda</strong></button>
                <button class="nav_btn" onclick="location.href='foro.html'"><strong>Foro</strong></button>
                <button class="nav_btn" onclick="location.href='blog.html'"><strong>Blog</strong></button>
            </figure>
        </header>

        <!-- Contenido principal -->
        <main class="contenido_ayuda">

            <section class="presentacion_ayuda">
                <img src="imagenes/atelierstudiologo.png" alt="Logo de AtelierStudio" class="logo_ayuda">
                <p>Envíanos tu consulta y te responderemos a la brevedad.</p>
            </section>

            <!-- Formulario de contacto -->
            <section class="contenedor_formulario_ayuda">

                <h2>Formulario de contacto</h2>
                <form id="formAyuda" class="formulario_ayuda" novalidate>
                    <p class="aviso_obligatorio"><span class="obligatorio">*</span>Campos obligatorios</p>

                    <!-- Nombre -->
                    <div class="campo_ayuda">
                        <label for="nombreAyuda"><strong>Nombre completo:<span class="obligatorio">*</span></strong></label>
                        <input type="text" id="nombreAyuda" name="nombreAyuda">
                        <small id="errorNombreAyuda"></small>
                    </div>

                    <!-- Correo -->
                    <div class="campo_ayuda">
                        <label for="correoAyuda"><strong>Correo electrónico:<span class="obligatorio">*</span></strong></label>
                        <input type="text" id="correoAyuda" name="correoAyuda" placeholder="ejemplo@duocuc.cl">
                        <small class="texto_ayuda">Dominios permitidos: @duocuc.cl, @profesor.duocuc.cl y @gmail.com</small>
                        <small id="errorCorreoAyuda"></small>
                    </div>

                    <!-- Comentario -->
                    <div class="campo_ayuda">
                        <label for="comentarioAyuda"><strong>Comentario:<span class="obligatorio">*</span></strong></label>
                        <textarea id="comentarioAyuda" name="comentarioAyuda" rows="6" placeholder="Escriba aquí su consulta"></textarea>
                        <small id="errorComentarioAyuda"></small>
                    </div>

                    <!-- Botón -->
                    <div class="boton_ayuda">
                        <button type="submit"><strong>ENVIAR MENSAJE</strong></button>
                    </div>
                </form>
            </section>
        </main>

        <!-- Validaciones del formulario -->
        <script src="ayuda.js"></script>

    </body>
</html>
