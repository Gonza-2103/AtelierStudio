<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Carrito</title>

        <!-- Estilos personalizados-->
        <link rel="stylesheet" href="styles.css">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU90FeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        
    </head>
    <body id="car">

        <!-- Título de 'carrito', logo y botones -->
        <header id="titulo_car">

            <!-- Título y logo -->
            <figure id="titlogo">
                <img src="imagenes/atelierstudiologo.png">
                <h2>Carrito</h2>
            </figure>

            <!-- Botones de navegación -->
            <figure id="btns_navegacion_car">
                <button id="nav_btn"><strong>Portada</strong></button>
                <button id="nav_btn"><strong>Nosotros</strong></button>
                <button id="nav_btn"><strong>Productos</strong></button>
                <button id="nav_btn"><strong>Búsqueda</strong></button>
                <button id="nav_btn"><strong>Foro</strong></button>
                <button id="nav_btn"><strong>Blog</strong></button>
                <button id="nav_btn"><strong>Ayuda</strong></button>
            </figure>
        </header>

        <!-- Contenido principal del carrito -->
        <main id="contenido_car">

            <section id="lista_productos_car">
                <h3 id="titulo_cont_car">Tu Selección de Obras</h3>

                <!-- Producto 1 en carrito -->
                <article class="item_car">
                    <figure class="img_item_car">
                        <img src="imagenes/fotoarte1.jpg" alt="Retrato Mar y Playa">
                    </figure>

                    <div class="info_item_car">
                        <h4>Retrato 'Mar y Playa'</h4>
                        <p class="precio_item_car"><strong>$45.000</strong></p>

                        <!-- Controles de cantidad -->
                        <div id="btns_cont_prod">
                            <button id="btn_restar"><strong>&minus;</strong></button>
                            <span id="numero_prod"><strong>0</strong></span>
                            <button id="btn_sumar"><strong>+</strong></button>
                        </div>
                    </div>
                </article>

                <hr color="white"/>

                <!-- Resumen de compra y pago -->
                <section id="resumen_compra_car">
                    <div class="fila_resumen">
                        <span>Subtotal:</span>
                        <span><strong>$45.000 CLP</strong></span>
                    </div>
                    <div class="fila_resumen">
                        <span>Envío estimado:</span>
                        <span><strong>$3.500 CLP</strong></span>
                    </div>
                    <div class="fila_resumen total_resumen">
                        <span>Total:</span>
                        <span><strong>$48.500 CLP</strong></span>
                    </div>

                    <div id="acciones_car">
                        <button id="btn_finalizar_compra"><strong>FINALIZAR COMPRA</strong></button>
                    </div>
                </section>
            </section>

            <!-- Enlace para volver a la tienda -->
            <footer class="foot_det_caso1">
                <p><a href="productos.html" style="color: goldenrod; text-decoration: underline;">&larr; Seguir explorando la galería</a></p>
            </footer>

        </main>

        <!-- Pie de página informativo -->
        <footer class="pie_pag_blog">
            <p>Viña del Mar, Chile.</p>
            <p><strong>&copy; 2026 AtelierStudio - Galería y Plataforma de Arte Independiente.</strong></p>
        </footer>
    </body>
</html>
