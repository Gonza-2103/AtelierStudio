<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Carrito</title>

        <!-- Estilos personalizados-->
        <link rel="stylesheet" href="styles.css">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU90FeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>
    <body id="car">

        <!-- Título de 'carrito', logo y botones -->
        <header id="titulo_car">

            <!-- Título y logo -->
            <figure id="titlogo">
                <img src="imagenes/atelierstudiologo.png" alt="AtelierStudio Logo">
                <h2>Carrito</h2>
            </figure>

            <!-- Botones de navegación -->
            <figure id="btns_navegacion_car">
                <button id="nav_btn" onclick="location.href='portada.html'"><strong>Portada</strong></button>
                <button id="nav_btn" onclick="location.href='nosotros.html'"><strong>Nosotros</strong></button>
                <button id="nav_btn" onclick="location.href='productos.html'"><strong>Productos</strong></button>
                <button id="nav_btn" onclick="location.href='busqueda.html'"><strong>Búsqueda</strong></button>
                <button id="nav_btn" onclick="location.href='foro.html'"><strong>Foro</strong></button>
                <button id="nav_btn" onclick="location.href='blog.html'"><strong>Blog</strong></button>
                <button id="nav_btn" onclick="location.href='contacto.html'"><strong>Contacto</strong></button>
            </figure>
        </header>

        <!-- Contenido principal del carrito -->
        <main id="contenido_car">
            
            <!-- Tarjeta del producto seleccionado -->
            <section id="contenedor_prod_car1">
                <figure id="contador_prod">
                    <h3>Cuadro 'Mar y Playa'</h3>
                    <h5 id="precio_prod1">$45.000</h5>
                    <img src="imagenes/fotoarte1.jpg" alt="Cuadro Mar y Playa">

                    <!-- Contador de unidades -->
                    <div id="btns_cont_prod">
                        <button id="btn_restar"><strong>&minus;</strong></button>
                        <span id="numero_prod"><strong>1</strong></span>
                        <button id="btn_sumar"><strong>+</strong></button>
                    </div>

                    <!-- Enlace estilo pie para quitar de la compra -->
                    <footer id="quitar_del_car">
                        <p><strong><a href="#">&times; Quitar del carrito</a></strong></p>
                    </footer>
                </figure>
            </section>

            <!-- Resumen de liquidación con cupón de descuento -->
            <section id="bloque_pago_car">
                <div id="fila_subtotal">
                    <span>Subtotal:</span>
                    <span>$45.000</span>
                </div>
                <div id="fila_envio">
                    <span>Envío:</span>
                    <span>$3.500</span>
                </div>

                <!-- Campo de cupón de descuento exigido en el mockup -->
                <div id="bloque_cupon">
                    <input type="text" id="input_cupon" placeholder="Ingresa cupón de descuento">
                    <button id="btn_aplicar_cupon">APLICAR</button>
                </div>

                <hr color="white"/>
                
                <div id="fila_total">
                    <span><strong>Total:</strong></span>
                    <span><strong>$48.500</strong></span>
                </div>
                <button id="btn_confirmar_compra"><strong>FINALIZAR COMPRA</strong></button>
            </section>

            <!-- Enlace para volver al catálogo -->
            <footer id="volver_catalogo_car">
                <p><a href="productos.html">&larr; Seguir explorando la galería</a></p>
            </footer>

        </main>

        <!-- Pie de página informativo -->
        <footer id="pie_pag_car">
            <p>Viña del Mar, Chile.</p>
            <p><strong>&copy; 2026 AtelierStudio - Galería y Plataforma de Arte Independiente.</strong></p>
            <br>
        </footer>
    </body>
</html>
